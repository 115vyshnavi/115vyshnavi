name: Update GitHub Streak

on:
  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "profile/github-streak.svg"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak card
        run: |
          mkdir -p profile

          python - <<'PY'
          import urllib.request
          import re
          from datetime import date, timedelta

          username = "115vyshnavi"

          url = f"https://github.com/users/{username}/contributions"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          svg = urllib.request.urlopen(request).read().decode("utf-8")

          # GitHub may change the order of HTML attributes,
          # so extract data-date and data-level independently.
          matches = re.findall(
              r'<td[^>]*data-date="([^"]+)"[^>]*data-level="([^"]+)"[^>]*>',
              svg
          )

          # Fallback if GitHub puts data-level before data-date.
          if not matches:
              matches = re.findall(
                  r'<td[^>]*data-level="([^"]+)"[^>]*data-date="([^"]+)"[^>]*>',
                  svg
              )

              matches = [
                  (day, level)
                  for level, day in matches
              ]

          contributions = {}

          for day, level in matches:
              contributions[day] = int(level)

          print(f"Days detected: {len(contributions)}")

          today = date.today()

          def level(day):
              return contributions.get(day.isoformat(), 0)

          # -------------------------
          # CURRENT STREAK
          # -------------------------

          current_streak = 0
          day = today

          while level(day) > 0:
              current_streak += 1
              day -= timedelta(days=1)

          if current_streak == 0:
              day = today - timedelta(days=1)

              while level(day) > 0:
                  current_streak += 1
                  day -= timedelta(days=1)

          # -------------------------
          # LONGEST STREAK
          # -------------------------

          longest_streak = 0
          running = 0

          start = today - timedelta(days=370)

          day = start

          while day <= today:

              if level(day) > 0:
                  running += 1
                  longest_streak = max(longest_streak, running)
              else:
                  running = 0

              day += timedelta(days=1)

          # -------------------------
          # TOTAL CONTRIBUTIONS
          # -------------------------

          total = sum(contributions.values())

          print(
              f"Current streak: {current_streak}"
          )

          print(
              f"Longest streak: {longest_streak}"
          )

          print(
              f"Contributions: {total}"
          )

          # -------------------------
          # CREATE SVG
          # -------------------------

          svg_output = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="220"
          viewBox="0 0 900 220">

          <rect
              width="900"
              height="220"
              rx="18"
              fill="#0D1117"/>

          <text
              x="450"
              y="45"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="bold">
              GitHub Streak
          </text>

          <line
              x1="70"
              y1="65"
              x2="830"
              y2="65"
              stroke="#30363D"/>

          <text
              x="150"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {current_streak}
          </text>

          <text
              x="150"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Current Streak
          </text>

          <text
              x="450"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {longest_streak}
          </text>

          <text
              x="450"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Longest Streak
          </text>

          <text
              x="750"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {total}
          </text>

          <text
              x="750"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Contributions
          </text>

          <text
              x="450"
              y="185"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="13">
              Automatically updated by GitHub Actions
          </text>

          </svg>
          '''

          with open(
              "profile/github-streak.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg_output)

          PY

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-streak.svg

          if git diff --cached --quiet; then
            echo "No streak changes to commit."
          else
            git commit -m "Update GitHub streak"
            git push
          fi
