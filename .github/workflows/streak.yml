name: Update GitHub Streak

on:
  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "profile/github-streak.svg"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p profile

          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          username = "115vyshnavi"

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-streak-generator"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          if "errors" in result:
              raise RuntimeError(result["errors"])

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          contributions = {}

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  contributions[day["date"]] = day["contributionCount"]

          # Use India time so the streak matches your local GitHub day.
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()

          def count_for(day):
              return contributions.get(day.isoformat(), 0)

          # -------------------------
          # CURRENT STREAK
          # -------------------------

          if count_for(today) > 0:
              current_streak = 0
              day = today

              while count_for(day) > 0:
                  current_streak += 1
                  day -= timedelta(days=1)

          else:
              yesterday = today - timedelta(days=1)

              if count_for(yesterday) > 0:
                  current_streak = 0
                  day = yesterday

                  while count_for(day) > 0:
                      current_streak += 1
                      day -= timedelta(days=1)

              else:
                  current_streak = 0

          # -------------------------
          # LONGEST STREAK
          # -------------------------

          longest_streak = 0
          running = 0

          days = sorted(contributions.keys())

          for day_string in days:
              day = date.fromisoformat(day_string)

              if count_for(day) > 0:
                  running += 1
                  longest_streak = max(longest_streak, running)
              else:
                  running = 0

          # -------------------------
          # TOTAL CONTRIBUTIONS
          # -------------------------

          total = calendar["totalContributions"]

          # -------------------------
          # CREATE SVG
          # -------------------------

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="220"
          viewBox="0 0 900 220">

          <rect
              width="900"
              height="220"
              rx="18"
              fill="#0D1117"/>

          <text
              x="450"
              y="45"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="bold">
              GitHub Streak
          </text>

          <line
              x1="70"
              y1="65"
              x2="830"
              y2="65"
              stroke="#30363D"/>

          <text
              x="150"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {current_streak}
          </text>

          <text
              x="150"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Current Streak
          </text>

          <text
              x="450"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {longest_streak}
          </text>

          <text
              x="450"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Longest Streak
          </text>

          <text
              x="750"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {total}
          </text>

          <text
              x="750"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Contributions
          </text>

          <text
              x="450"
              y="185"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="13">
              Updated automatically by GitHub Actions
          </text>

          </svg>
          '''

          with open(
              "profile/github-streak.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("======================================")
          print(f"Today:              {today}")
          print(f"Today's commits:    {count_for(today)}")
          print(f"Current streak:     {current_streak}")
          print(f"Longest streak:     {longest_streak}")
          print(f"Total contributions:{total}")
          print("======================================")
          PY

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub streak"
            git push
          fi
