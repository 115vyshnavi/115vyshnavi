name: Update GitHub Streak

on:
  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "profile/github-streak.svg"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # 1. Get repository
      # -----------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Generate streak card
      # -----------------------------

      - name: Generate streak card
        run: |

          mkdir -p profile

          python - <<'PY'

          import urllib.request
          import re
          from datetime import date, timedelta


          # ==========================================
          # YOUR GITHUB USERNAME
          # ==========================================

          username = "115vyshnavi"


          # ==========================================
          # GET GITHUB CONTRIBUTION CALENDAR
          # ==========================================

          url = f"https://github.com/users/{username}/contributions"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          html = urllib.request.urlopen(request).read().decode("utf-8")


          # ==========================================
          # READ CONTRIBUTION DAYS
          # ==========================================

          contributions = {}


          # Get every contribution calendar cell
          cells = re.findall(
              r"<td\b[^>]*>",
              html
          )


          for cell in cells:

              # Get date
              date_match = re.search(
                  r'data-date="([^"]+)"',
                  cell
              )

              if not date_match:
                  continue

              day = date_match.group(1)


              # Get contribution count
              #
              # Example:
              # aria-label="5 contributions on August 20, 2026"
              #

              count_match = re.search(
                  r'aria-label="(\d+)\s+contribution',
                  cell,
                  re.IGNORECASE
              )

              if count_match:

                  count = int(
                      count_match.group(1)
                  )

              else:

                  count = 0


              contributions[day] = count


          # ==========================================
          # DEBUG INFORMATION
          # ==========================================

          print(
              "Contribution days detected:",
              len(contributions)
          )


          print("\nRecent contribution days:")


          for day in sorted(contributions)[-20:]:

              print(
                  day,
                  "->",
                  contributions[day]
              )


          # ==========================================
          # DATE HELPER
          # ==========================================

          today = date.today()


          def has_contribution(day):

              return contributions.get(
                  day.isoformat(),
                  0
              ) > 0


          # ==========================================
          # CURRENT STREAK
          # ==========================================

          current_streak = 0

          day = today


          while has_contribution(day):

              current_streak += 1

              day -= timedelta(days=1)


          # If today's contribution has not appeared
          # on GitHub yet, start from yesterday.

          if current_streak == 0:

              day = today - timedelta(days=1)


              while has_contribution(day):

                  current_streak += 1

                  day -= timedelta(days=1)


          # ==========================================
          # LONGEST STREAK
          # ==========================================

          longest_streak = 0

          running = 0


          # GitHub contribution calendar gives roughly
          # one year of contribution history.

          start = today - timedelta(days=370)

          day = start


          while day <= today:

              if has_contribution(day):

                  running += 1

                  longest_streak = max(
                      longest_streak,
                      running
                  )

              else:

                  running = 0


              day += timedelta(days=1)


          # ==========================================
          # TOTAL CONTRIBUTION DAYS
          # ==========================================

          total_contribution_days = sum(
              1
              for count in contributions.values()
              if count > 0
          )


          # ==========================================
          # PRINT RESULTS
          # ==========================================

          print("\n==============================")

          print(
              "Current streak:",
              current_streak
          )

          print(
              "Longest streak:",
              longest_streak
          )

          print(
              "Contribution days:",
              total_contribution_days
          )

          print("==============================\n")


          # ==========================================
          # CREATE SVG
          # ==========================================

          svg_output = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="900"
          height="220"
          viewBox="0 0 900 220">

          <rect
              width="900"
              height="220"
              rx="18"
              fill="#0D1117"/>


          <text
              x="450"
              y="45"
              text-anchor="middle"
              fill="#FFFFFF"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="bold">
              GitHub Streak
          </text>


          <line
              x1="70"
              y1="65"
              x2="830"
              y2="65"
              stroke="#30363D"/>


          <!-- CURRENT STREAK -->

          <text
              x="150"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {current_streak}
          </text>


          <text
              x="150"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Current Streak
          </text>


          <!-- LONGEST STREAK -->

          <text
              x="450"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {longest_streak}
          </text>


          <text
              x="450"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Longest Streak
          </text>


          <!-- CONTRIBUTION DAYS -->

          <text
              x="750"
              y="110"
              text-anchor="middle"
              fill="#8B9DFF"
              font-family="Arial, sans-serif"
              font-size="38"
              font-weight="bold">
              {total_contribution_days}
          </text>


          <text
              x="750"
              y="140"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="15">
              Contribution Days
          </text>


          <text
              x="450"
              y="185"
              text-anchor="middle"
              fill="#8B949E"
              font-family="Arial, sans-serif"
              font-size="13">
              Automatically updated by GitHub Actions
          </text>


          </svg>
          '''


          # ==========================================
          # SAVE SVG
          # ==========================================

          with open(
              "profile/github-streak.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg_output)


          PY


      # -----------------------------
      # 3. Commit updated SVG
      # -----------------------------

      - name: Commit updated streak
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add profile/github-streak.svg


          if git diff --cached --quiet; then

            echo "No streak changes to commit."

          else

            git commit -m "Update GitHub streak"

            git push

          fi
